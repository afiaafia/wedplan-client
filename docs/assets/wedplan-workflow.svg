<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="title description">
  <title id="title">WedPlan role journeys</title>
  <desc id="description">Customer, vendor, and administrator workflows</desc>
  <rect width="1200" height="420" rx="24" fill="#fffcf8"/>
  <g font-family="Arial, sans-serif">
    <g transform="translate(36 48)">
      <rect width="352" height="324" rx="20" fill="#fff" stroke="#e9e1dc"/>
      <rect x="20" y="20" width="312" height="48" rx="12" fill="#75434b"/>
      <text x="176" y="51" fill="#fff" font-size="18" font-weight="700" text-anchor="middle">CUSTOMER</text>
      <g fill="#30272a" font-size="15">
        <circle cx="44" cy="105" r="16" fill="#f1dfdc"/><text x="44" y="110" fill="#75434b" text-anchor="middle" font-weight="700">1</text><text x="72" y="111"><tspan font-weight="700">Discover</tspan> approved services</text>
        <circle cx="44" cy="155" r="16" fill="#f1dfdc"/><text x="44" y="160" fill="#75434b" text-anchor="middle" font-weight="700">2</text><text x="72" y="161"><tspan font-weight="700">Choose</tspan> a suitable vendor</text>
        <circle cx="44" cy="205" r="16" fill="#f1dfdc"/><text x="44" y="210" fill="#75434b" text-anchor="middle" font-weight="700">3</text><text x="72" y="211"><tspan font-weight="700">Book</tspan> an event date</text>
        <circle cx="44" cy="255" r="16" fill="#f1dfdc"/><text x="44" y="260" fill="#75434b" text-anchor="middle" font-weight="700">4</text><text x="72" y="261"><tspan font-weight="700">Track</tspan> booking status</text>
      </g>
    </g>
    <g transform="translate(424 48)">
      <rect width="352" height="324" rx="20" fill="#fff" stroke="#e9e1dc"/>
      <rect x="20" y="20" width="312" height="48" rx="12" fill="#b89570"/>
      <text x="176" y="51" fill="#30272a" font-size="18" font-weight="700" text-anchor="middle">VENDOR</text>
      <g fill="#30272a" font-size="15">
        <circle cx="44" cy="105" r="16" fill="#f4edea"/><text x="44" y="110" fill="#75434b" text-anchor="middle" font-weight="700">1</text><text x="72" y="111"><tspan font-weight="700">Join</tspan> as a service provider</text>
        <circle cx="44" cy="155" r="16" fill="#f4edea"/><text x="44" y="160" fill="#75434b" text-anchor="middle" font-weight="700">2</text><text x="72" y="161"><tspan font-weight="700">Publish</tspan> approved listings</text>
        <circle cx="44" cy="205" r="16" fill="#f4edea"/><text x="44" y="210" fill="#75434b" text-anchor="middle" font-weight="700">3</text><text x="72" y="211"><tspan font-weight="700">Manage</tspan> availability &amp; requests</text>
        <circle cx="44" cy="255" r="16" fill="#f4edea"/><text x="44" y="260" fill="#75434b" text-anchor="middle" font-weight="700">4</text><text x="72" y="261"><tspan font-weight="700">Grow</tspan> with subscription tools</text>
      </g>
    </g>
    <g transform="translate(812 48)">
      <rect width="352" height="324" rx="20" fill="#fff" stroke="#e9e1dc"/>
      <rect x="20" y="20" width="312" height="48" rx="12" fill="#30272a"/>
      <text x="176" y="51" fill="#fff" font-size="18" font-weight="700" text-anchor="middle">ADMIN</text>
      <g fill="#30272a" font-size="15">
        <circle cx="44" cy="105" r="16" fill="#ebe6e4"/><text x="44" y="110" fill="#30272a" text-anchor="middle" font-weight="700">1</text><text x="72" y="111"><tspan font-weight="700">Monitor</tspan> platform activity</text>
        <circle cx="44" cy="155" r="16" fill="#ebe6e4"/><text x="44" y="160" fill="#30272a" text-anchor="middle" font-weight="700">2</text><text x="72" y="161"><tspan font-weight="700">Moderate</tspan> vendor services</text>
        <circle cx="44" cy="205" r="16" fill="#ebe6e4"/><text x="44" y="210" fill="#30272a" text-anchor="middle" font-weight="700">3</text><text x="72" y="211"><tspan font-weight="700">Manage</tspan> accounts &amp; bookings</text>
        <circle cx="44" cy="255" r="16" fill="#ebe6e4"/><text x="44" y="260" fill="#30272a" text-anchor="middle" font-weight="700">4</text><text x="72" y="261"><tspan font-weight="700">Oversee</tspan> payment records</text>
      </g>
    </g>
  </g>
</svg>
